name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore CashOut/CashOut.csproj

      - name: Build
        run: dotnet build CashOut/CashOut.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test CashOut.Tests/CashOut.Tests.csproj --no-build --configuration Release --verbosity normal
