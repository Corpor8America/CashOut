name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore CashOut.sln

      - name: Build
        run: dotnet build CashOut.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CashOut.sln --no-build --configuration Release --verbosity normal --filter "TestCategory!=UI"

  ui-test:
    name: Playwright Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore CashOut.sln

      - name: Build
        run: dotnet build CashOut.sln --no-restore --configuration Release

      - name: Install Playwright Browsers
        run: pwsh CashOut.Tests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Run UI Tests
        run: dotnet test CashOut.Tests/CashOut.Tests.csproj --filter "TestCategory=UI" --configuration Release --no-build --verbosity normal
